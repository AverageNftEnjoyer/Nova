appId: com.nova.hud
productName: Nova
copyright: Copyright © 2026 Nova

directories:
  output: dist
  buildResources: electron/build

# asar is OFF for this app. The DB and the Next.js production server run in Electron's main process
# (see hud/electron/production-server.js): Next's custom server reads its own build output (.next/**)
# off disk at request time, and the better-sqlite3 .node addon is loaded from a real directory rather
# than out of an asar archive. Packing everything unarchived avoids both problems, at the cost of a
# larger, unarchived install directory. There is no asarUnpack.
asar: false

files:
  - .next/**/*
  - public/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*
  # electron-builder inserts `!**/node_modules/**` before the first node_modules include above, which
  # drops `.next/node_modules/<pkg>-<hash>` even though `.next/**/*` matched it. Turbopack externalizes
  # better-sqlite3 to that hashed directory (see hud/scripts/prepare-runtime-resources.mjs, which
  # replaces the symlink with a real copy). This later include puts that directory back. Without it,
  # `/api/agent-tasks` returns 500: Cannot find module 'better-sqlite3-<hash>'.
  - .next/node_modules/**/*
  # Size: none of this is needed by the installed app, and together it was over 400 MB of a 565 MB
  # installer. `.next/dev` is leftover cache from running `npm run dev` in the same folder (307 MB);
  # `.next/cache` and `.next/types` are build-time only; `@next/swc-*` are Next's compiler binaries
  # (123 MB), which a running production server never uses. `smoke:production-boot` proves the
  # packaged server still boots without them. Keep these AFTER the includes above so they win.
  - "!.next/dev/**"
  - "!.next/cache/**"
  - "!.next/types/**"
  - "!node_modules/@next/swc-*/**"
  # Staged separately (see hud/scripts/prepare-runtime-resources.mjs) and copied in via
  # extraResources below, so it is not also packed here.
  - "!runtime-resources/**"
  # User data must never ship inside an installer (see docs/security/local-data.md).
  - "!**/.user/**"
  - "!**/.nova-data/**"
  - "!data/**"
  - "!keys/**"
  - "!**/*.db"
  - "!**/*.db-wal"
  - "!**/*.db-shm"
  - "!**/*.db-journal"

# The repo-root `src/` runtime (agent-task scheduler, chat handler, tool loop, SQLite layer, ...),
# its compiled `dist/` shims, and its own node_modules — staged by
# hud/scripts/prepare-runtime-resources.mjs, wired into `npm run electron:build`/`electron:build:win`
# before electron-builder runs. Landed at <resourcesPath>/runtime-resources (sibling of the app
# directory, not inside it), so hud/electron/production-server.js finds it via `process.resourcesPath`.
#
# `from: .` + a `runtime-resources/**/*` filter (NOT `from: runtime-resources`) is deliberate:
# electron-builder's file walker unconditionally drops a directory literally named `node_modules`
# when it sits at the root of `from` (app-builder-lib's createFilter — true for every matcher, `files`
# and `extraResources` alike, no pattern can override it), which silently dropped
# `runtime-resources/node_modules` end to end when `from` pointed straight at `runtime-resources`.
# Nesting one level deeper means the offending path is `runtime-resources/node_modules`, not a bare
# `node_modules`, so it copies normally. Confirmed with a real `--dir` build during Closure 4.
#
# better-sqlite3 >=13 ships a bundled N-API prebuild (prebuilds/win32-x64.node). That binary is not
# ABI-pinned to Node vs. Electron, so the staging script verifies it and does not run an Electron-ABI
# rebuild. electron-builder's own `npmRebuild` (default true) only walks node_modules inside `files`
# above (hud's own), which does not include better-sqlite3, so it never touches this staged copy or
# the repo-root copy used by `nova.js`.
extraResources:
  - from: .
    to: .
    filter:
      - "runtime-resources/**/*"

# Auto-update feed: the installed app checks this repo's GitHub Releases (public repo, so no token is
# needed in the app). `npm run electron:publish:win` uploads the installer + latest.yml; the release is created
# as a DRAFT and must be published on GitHub before installed apps will see it. See docs/release/auto-update.md.
publish:
  provider: github
  owner: AverageNftEnjoyer
  repo: Nova

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/images/nova.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

