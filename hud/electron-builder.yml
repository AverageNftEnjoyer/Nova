appId: com.nova.hud
productName: U.B Agents
copyright: Copyright © 2026 U.B Agents

directories:
  output: dist
  buildResources: electron/build

# asar is OFF for this app. The DB and the Next.js production server run in Electron's main process
# (see hud/electron/production-server.js): Next's custom server reads its own build output (.next/**)
# off disk at request time, and the better-sqlite3 .node addon is loaded from a real directory rather
# than out of an asar archive. Packing everything unarchived avoids both problems, at the cost of a
# larger, unarchived install directory. There is no asarUnpack.
asar: false

# Chromium ships ~55 locale packs (~45 MB). The UI is English only; keep en-US.pak.
electronLanguages:
  - en-US

# Trims the packaged better-sqlite3 copies to the win32-x64 prebuild (see hud/scripts/after-pack.js).
afterPack: scripts/after-pack.js

files:
  - .next/**/*
  - public/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*
  # electron-builder inserts `!**/node_modules/**` before the first node_modules include above, which
  # drops `.next/node_modules/<pkg>-<hash>` even though `.next/**/*` matched it. Turbopack externalizes
  # better-sqlite3 to that hashed directory (see hud/scripts/prepare-runtime-resources.mjs, which
  # replaces the symlink with a real copy). This later include puts that directory back. Without it,
  # `/api/agent-tasks` returns 500: Cannot find module 'better-sqlite3-<hash>'.
  - .next/node_modules/**/*
  # Size: none of this is needed by the installed app, and together it was over 400 MB of a 565 MB
  # installer. `.next/dev` is leftover cache from running `npm run dev` in the same folder (307 MB);
  # `.next/cache` and `.next/types` are build-time only; `@next/swc-*` are Next's compiler binaries
  # (123 MB), which a running production server never uses. `smoke:production-boot` proves the
  # packaged server still boots without them. Keep these AFTER the includes above so they win.
  - "!.next/dev/**"
  - "!.next/cache/**"
  - "!.next/types/**"
  - "!node_modules/@next/swc-*/**"
  # Source maps (~37 MB) are only for debugging the client bundles; the installed app never loads them.
  - "!.next/**/*.map"
  # sharp is Next's image optimizer. next.config.js sets `images.unoptimized`, so /_next/image is never
  # served and sharp (plus its @img/* native binaries) is dead weight.
  - "!node_modules/@img/**"
  - "!node_modules/sharp/**"
  # @emnapi/runtime is only there for sharp's wasm build (dropped above).
  - "!node_modules/@emnapi/**"
  # Build-time-only dependencies of `next`: browserslist data (caniuse-lite, baseline-browser-mapping)
  # and the PostCSS pinned for Next's CSS pipeline. `next build` uses them; the production server
  # does not, and Next's own standalone trace (see below) leaves all three out. Nothing else in the
  # production closure depends on them (`npm ls <name> --omit=dev` shows next as the only parent).
  - "!node_modules/caniuse-lite/**"
  - "!node_modules/baseline-browser-mapping/**"
  - "!node_modules/postcss/**"
  # Source maps in dependencies are debugging aids only (node_modules/next and react-dom are further
  # pruned to Next's output file trace by hud/scripts/after-pack.js).
  - "!node_modules/**/*.map"
  # `npm run build:package` writes Next's standalone trace here. after-pack.js reads it as the
  # allowlist for node_modules/next and react-dom, but the copy itself must not ship: it duplicates
  # .next and node_modules.
  - "!.next/standalone/**"
  # Build/deploy metadata the production server never reads: output-file-trace manifests (`*.nft.json`,
  # ~5 MB: most API routes trace the whole project) and the build's `trace`/`trace-build` event logs.
  - "!.next/**/*.nft.json"
  - "!.next/trace"
  - "!.next/trace-build"
  # jsdom is a Next default server-external: the compiled routes require the dereferenced
  # `.next/node_modules/jsdom-<hash>` copy (kept above), never plain `jsdom`, and Electron main does not
  # use it. Its dependencies (whatwg-url, cssstyle, ...) stay: that copy resolves them from here.
  # hud/scripts/after-pack.js fails the build if a compiled chunk ever requires plain `jsdom`.
  - "!node_modules/jsdom/**"
  # Staged separately (see hud/scripts/prepare-runtime-resources.mjs) and copied in via
  # extraResources below, so it is not also packed here.
  - "!runtime-resources/**"
  # User data must never ship inside an installer (see docs/security/local-data.md).
  - "!**/.user/**"
  - "!**/.nova-data/**"
  - "!data/**"
  - "!keys/**"
  - "!**/*.db"
  - "!**/*.db-wal"
  - "!**/*.db-shm"
  - "!**/*.db-journal"

# The repo-root `src/` runtime (agent-task scheduler, chat handler, tool loop, SQLite layer, ...),
# its compiled `dist/` shims, and its own node_modules — staged by
# hud/scripts/prepare-runtime-resources.mjs, wired into `npm run electron:build`/`electron:build:win`
# before electron-builder runs. Landed at <resourcesPath>/runtime-resources (sibling of the app
# directory, not inside it), so hud/electron/production-server.js finds it via `process.resourcesPath`.
#
# `from: .` + a `runtime-resources/**/*` filter (NOT `from: runtime-resources`) is deliberate:
# electron-builder's file walker unconditionally drops a directory literally named `node_modules`
# when it sits at the root of `from` (app-builder-lib's createFilter — true for every matcher, `files`
# and `extraResources` alike, no pattern can override it), which silently dropped
# `runtime-resources/node_modules` end to end when `from` pointed straight at `runtime-resources`.
# Nesting one level deeper means the offending path is `runtime-resources/node_modules`, not a bare
# `node_modules`, so it copies normally. Confirmed with a real `--dir` build during Closure 4.
#
# better-sqlite3 >=13 ships a bundled N-API prebuild (prebuilds/win32-x64.node). That binary is not
# ABI-pinned to Node vs. Electron, so the staging script verifies it and does not run an Electron-ABI
# rebuild. electron-builder's own `npmRebuild` (default true) only walks node_modules inside `files`
# above (hud's own), which does not include better-sqlite3, so it never touches this staged copy or
# the repo-root copy used by `nova.js`.
#
# electron-builder's default excludes (`*.d.ts`, VCS files, lockfiles, ...) apply to `files` only, not
# to extraResources, so the ones that matter are repeated here. None of this is loaded at runtime:
#   - source maps (~17 MB)
#   - TypeScript files (~15 MB): declarations (incl. @types/node + @types/ws, pulled in by
#     @openai/agents-realtime) and sources that zod/openai/ajv ship next to their compiled JS (zod exposes
#     them only under its custom `@zod/source` export condition). Node refuses to type-strip anything
#     under node_modules, so a .ts file there can never be loaded anyway.
#   - README/CHANGELOG/CONTRIBUTING markdown (LICENSE files are kept)
#   - @mixmark-io/domino's test suite (7 MB; turndown's DOM, `main` is ./lib)
#   - the runtime's own unit tests (`src/**/*.test.*`; nothing imports them)
extraResources:
  - from: .
    to: .
    filter:
      - "runtime-resources/**/*"
      - "!runtime-resources/node_modules/**/*.map"
      - "!runtime-resources/node_modules/**/*.{ts,mts,cts}"
      - "!runtime-resources/node_modules/**/{README,Readme,readme,CHANGELOG,changelog,HISTORY,History,CONTRIBUTING}.md"
      - "!runtime-resources/node_modules/@mixmark-io/domino/test/**"
      - "!runtime-resources/src/**/*.test.*"

# Auto-update feed: the installed app checks this repo's GitHub Releases (public repo, so no token is
# needed in the app). `npm run electron:publish:win` uploads the installer + latest.yml; the release is created
# as a DRAFT and must be published on GitHub before installed apps will see it. See docs/release/auto-update.md.
publish:
  provider: github
  owner: AverageNftEnjoyer
  repo: Nova

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/images/nova.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

